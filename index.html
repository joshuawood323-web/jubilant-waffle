<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Site Access Information RSM</title><link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/ol@latest/ol.css'><script src='https://cdn.jsdelivr.net/npm/ol@latest/dist/ol.js'></script><style>body{margin:0;font-family:Segoe UI}header{background:#003366;color:#fff;padding:10px;display:flex;justify-content:space-between;align-items:center}#logo{background:#fff;color:#222;padding:8px 12px;font-weight:700;line-height:1}.bar{height:8px;background:linear-gradient(90deg,#f59e0b,#facc15,#22c55e,#06b6d4);margin-top:6px}#wrap{display:grid;grid-template-columns:340px 1fr;height:calc(100vh - 80px)}#left{padding:10px;border-right:1px solid #ccc;overflow:auto}.site{padding:6px;border-bottom:1px solid #eee;cursor:pointer}.site:hover{background:#eef}button{width:100%;padding:10px;margin:3px 0;border:0;background:#0078d4;color:#fff}.danger{background:#c62828}.card{background:#f5f5f5;padding:10px;border-radius:6px;margin-top:10px}#form{display:none}input,textarea{width:100%;box-sizing:border-box;padding:8px;margin:4px 0}#map{width:100%;height:100%}</style></head><body><header><h2>Site Access Information RSM</h2><div id='logo'>RADIO SPECTRUM<br>MANAGEMENT<div class='bar'></div></div></header><div id='wrap'><div id='left'><input id='search' placeholder='Search' style='width:100%;padding:8px'><div id='list'></div><button onclick='newSite()'>➕ Add New Site</button><button onclick='editSite()'>✏️ Edit Site</button><button onclick='copyCoords()'>📋 Copy Coordinates</button><button onclick='exportCSV()'>📊 Export CSV</button><button onclick="document.getElementById('csvFile').click()">📂 Import CSV</button><input type='file' id='csvFile' accept='.csv' style='display:none'><button class='danger' onclick='deleteSite()'>🗑️ Delete Site</button><div id='info' class='card'>Select a site...</div><div id='form' class='card'><h3>Add/Edit Site</h3><input id='siteId' placeholder='Site ID'><input id='siteName' placeholder='Site Name'><input id='coords' placeholder='Coordinates'><input id='landowner' placeholder='Land Owner'><input id='contactNumber' placeholder='Contact Number'><input id='contactEmail' placeholder='Contact Email'><textarea id='instructions' placeholder='Site Instructions'></textarea><button onclick='saveSite()'>Save Site</button></div></div><div id='map'></div></div><script>let selected=-1;let sites=JSON.parse(localStorage.getItem('sitesRSM'))||[{id:1,name:'LUDSTONE',lat:-42.4063,lon:173.6684},{id:2,name:'KAIKOURA RESERVOIR',lat:-42.4193,lon:173.6925},{id:223,name:'OTAKI RACECOURSE',lat:-40.7667,lon:175.1644}];const sat=new ol.layer.Tile({source:new ol.source.XYZ({url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'})});const src=new ol.source.Vector();const vec=new ol.layer.Vector({source:src,style:f=>new ol.style.Style({image:new ol.style.Circle({radius:12,fill:new ol.style.Fill({color:'red'}),stroke:new ol.style.Stroke({color:'white',width:4})}),text:new ol.style.Text({text:(sites[f.get('idx')]||{}).name||'',offsetY:-18,fill:new ol.style.Fill({color:'#fff'}),stroke:new ol.style.Stroke({color:'#000',width:3})})})});const map=new ol.Map({target:'map',layers:[sat,vec],view:new ol.View({center:ol.proj.fromLonLat([174.77,-41.28]),zoom:6})});function refresh(){src.clear();sites.forEach((s,i)=>src.addFeature(new ol.Feature({geometry:new ol.geom.Point(ol.proj.fromLonLat([+s.lon,+s.lat])),idx:i})));localStorage.setItem('sitesRSM',JSON.stringify(sites));list.innerHTML=sites.map((s,i)=>`<div class='site' onclick='showSite(${i})'>${s.id} - ${s.name}</div>`).join('');}function showSite(i){selected=i;const s=sites[i];info.innerHTML=`<h3>${s.name}</h3><b>Site ID:</b> ${s.id}<br><b>Coordinates:</b> ${s.lat}, ${s.lon}<br><b>Land Owner:</b> ${s.landowner||''}<br><b>Contact Number:</b> ${s.contactNumber||''}<br><b>Contact Email:</b> ${s.contactEmail||''}<br><b>Instructions:</b><br>${s.instructions||''}<br><br><a target='_blank' href='https://maps.google.com/?q=${s.lat},${s.lon}'>📍 Open in Google Maps</a>`;map.getView().animate({center:ol.proj.fromLonLat([+s.lon,+s.lat]),zoom:14});}function newSite(){selected=-1;form.style.display='block';document.querySelectorAll('#form input,#form textarea').forEach(x=>x.value='');}function editSite(){if(selected<0)return;let s=sites[selected];form.style.display='block';siteId.value=s.id||'';siteName.value=s.name||'';coords.value=s.lat+','+s.lon;landowner.value=s.landowner||'';contactNumber.value=s.contactNumber||'';contactEmail.value=s.contactEmail||'';instructions.value=s.instructions||'';}function saveSite(){let c=coords.value.split(',');let s={id:siteId.value,name:siteName.value,lat:c[0].trim(),lon:(c[1]||'').trim(),landowner:landowner.value,contactNumber:contactNumber.value,contactEmail:contactEmail.value,instructions:instructions.value};if(selected>=0)sites[selected]=s;else{sites.push(s);selected=sites.length-1;}form.style.display='none';refresh();showSite(selected);}function deleteSite(){if(selected<0)return;sites.splice(selected,1);selected=-1;refresh();info.innerHTML='Select a site...';}function copyCoords(){if(selected>=0)navigator.clipboard.writeText(sites[selected].lat+','+sites[selected].lon);}function exportCSV(){let csv='Site ID,Site Name,Coordinates,Land Owner,Contact Number,Contact Email,Site Instructions\n';sites.forEach(s=>{csv+=[s.id||'',`"${s.name||''}"`,`"${s.lat},${s.lon}"`,`"${s.landowner||''}"`,`"${s.contactNumber||''}"`,`"${s.contactEmail||''}"`,`"${s.instructions||''}"`].join(',')+'\n';});const b=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='Site_Access_Register.csv';a.click();}document.getElementById('csvFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const lines=r.result.split(/\r?\n/).slice(1).filter(Boolean);sites=lines.map(l=>{const p=l.match(/("[^"]*"|[^,]+)/g)||[];const c=(p[2]||'').replace(/"/g,'').split(',');return{id:(p[0]||'').replace(/"/g,''),name:(p[1]||'').replace(/"/g,''),lat:c[0]||'',lon:c[1]||'',landowner:(p[3]||'').replace(/"/g,''),contactNumber:(p[4]||'').replace(/"/g,''),contactEmail:(p[5]||'').replace(/"/g,''),instructions:(p[6]||'').replace(/"/g,'')};});refresh();};r.readAsText(f);});search.oninput=e=>{const q=e.target.value.toLowerCase();list.innerHTML=sites.filter(s=>s.name.toLowerCase().includes(q)).map(s=>`<div class='site' onclick='showSite(${sites.indexOf(s)})'>${s.id} - ${s.name}</div>`).join('');};map.on('click',e=>map.forEachFeatureAtPixel(e.pixel,f=>showSite(f.get('idx'))));refresh();</script></body></html>
